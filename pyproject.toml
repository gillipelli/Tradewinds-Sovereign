[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradewinds-sovereign"
version = "0.1.0"
description = "Vintage-aware Bayesian ENSO agriculture and sovereign fiscal stress research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "pymc>=5.20,<6", "arviz>=0.20,<1", "matplotlib>=3.9,<4", "seaborn>=0.13,<1",
  "plotly>=6,<7", "streamlit>=1.45,<2", "requests>=2.32,<3", "openpyxl>=3.1,<4",
  "lxml>=5,<7", "pyyaml>=6,<7",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "nbformat>=5,<6",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]
[project.scripts]
tradewinds = "tradewinds.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.hatch.build.targets.wheel]
packages = ["src/tradewinds"]
